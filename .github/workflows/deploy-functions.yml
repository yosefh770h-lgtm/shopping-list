# העלאה אוטומטית של פונקציות השרת (יאמי, התראות, קופה, מחירים, הגנת כניסה) ל-Supabase
# בכל שינוי בתיקייה supabase/functions שנכנס ל-main — בלי להעתיק ולהדביק.
# הגדרה חד־פעמית: GitHub ← Settings ← Secrets and variables ← Actions ← New repository secret
#   שם: SUPABASE_ACCESS_TOKEN · ערך: טוקן מ-https://supabase.com/dashboard/account/tokens
# בלי הטוקן — הפעולה מדלגת בשקט (ואפשר להמשיך להעלות ידנית מהבק אופיס).
name: Deploy Supabase functions
on:
  push:
    branches: [main]
    paths: ['supabase/functions/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ygyfodxfbebnkwdcbjrp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Skip when no token
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: echo "::warning::SUPABASE_ACCESS_TOKEN is not set — skipping automatic deploy"
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        if: env.SUPABASE_ACCESS_TOKEN != ''
        with:
          version: 2.122.1
      - name: Deploy every function
        if: env.SUPABASE_ACCESS_TOKEN != ''
        # כל הפונקציות בודקות בעצמן מי המשתמש — לכן "Verify JWT" כבוי (כמו בהוראות בבק אופיס)
        run: |
          for dir in supabase/functions/*/; do
            name=$(basename "$dir")
            echo "▶ $name"
            supabase functions deploy "$name" --project-ref "$PROJECT_REF" --no-verify-jwt --yes
          done
