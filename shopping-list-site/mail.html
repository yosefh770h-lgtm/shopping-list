<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>המייל השבועי | רשימת קניות</title>
<meta name="theme-color" content="#1e3a5f">
<link rel="icon" type="image/png" href="icons/app-192.png">
<style>
:root{--bg:#f6f3ec;--card:#fffdf7;--text:#23231f;--muted:#6d6d62;--accent:#1e3a5f;--line:#e3ddcf;--btn:#0f5d50;--btnt:#fff;--soft:#e7f3ef}
@media (prefers-color-scheme:dark){:root{--bg:#0d1118;--card:#161a22;--text:#e6e6da;--muted:#98a0ad;--accent:#9db8e0;--line:#2a303b;--btn:#2f8f7c;--btnt:#fff;--soft:#22322c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Heebo,Arial,sans-serif;line-height:1.7;padding:24px 16px 48px}
main{max-width:520px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 20px;text-align:center}
.logo{width:56px;height:56px;border-radius:12px}
h1{font-size:22px;margin:10px 0 6px;color:var(--accent)}
p{font-size:16px;margin:8px 0}
.muted{color:var(--muted);font-size:14px}
.btn{display:inline-block;border:0;border-radius:999px;padding:12px 24px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;text-decoration:none;margin:6px 4px;background:var(--btn);color:var(--btnt)}
.btn.sec{background:var(--soft);color:var(--accent)}
.btn:disabled{opacity:.6;cursor:default}
.reasons{text-align:start;margin:14px auto;max-width:360px}
.reasons label{display:block;padding:6px 4px;font-size:15px;cursor:pointer}
textarea{width:100%;min-height:60px;border:1px solid var(--line);border-radius:10px;padding:8px;font:inherit;background:var(--bg);color:var(--text)}
</style>
</head>
<body>
<main id="m" aria-live="polite">
  <img class="logo" src="logo.png" alt="">
  <h1>רשימת קניות</h1>
  <p class="muted">רגע...</p>
</main>
<script src="/js/pages/mail.js?v=eaaa0c2438"></script>
</body>
</html>
