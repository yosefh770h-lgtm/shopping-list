button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #ffd166;outline-offset:2px}
button[disabled]{opacity:.55;cursor:default}
a{color:var(--accent)}
#st{min-height:24px;margin:10px 0}
.res{list-style:none;padding:0;margin:8px 0}
.res li{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:6px 0}
.res li.first{border-color:var(--gold);border-width:2px}
.res .n{font-size:22px;width:30px;text-align:center;flex:none}
.res .w{flex:1;min-width:0}
.res .c{font-weight:700;font-size:17px}

.prev{display:block;width:100%;max-width:420px;margin:10px auto;border-radius:12px;border:1px solid var(--line)}
.items{columns:2;column-gap:24px;padding-inline-start:18px;margin:4px 0;font-size:15px}
.items li{break-inside:avoid}
details summary{cursor:pointer;color:var(--accent);font-weight:700}
